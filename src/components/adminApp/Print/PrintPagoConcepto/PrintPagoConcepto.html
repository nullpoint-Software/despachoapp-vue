<Teleport to="body">
  <div class="ticket-printer-overlay">
    <div class="ticket-printer-modal">
      <header class="ticket-modal-header">
        <p>CAJA / IMPRESIÓN TÉRMICA</p>
        <h2>Ticket de pago</h2>
        <button type="button" aria-label="Cerrar" @click="$emit('close')">×</button>
      </header>
      <div class="ticket-modal-body">
        <!-- Seccion para seleccionar la impresora -->
        <AgnesConnectionNotice :refresh-key="agnesConnectionRevision" />
        <p>Se usará la impresora guardada en <strong>Configuración</strong>.</p>
        <!-- Vista previa del ticket -->
        <div class="ticket">
          <span>Vista previa / {{ paperWidth }} mm</span>
          <div class="ticket-logo"><img :src="logo" alt="Logo" /></div>
          <pre class="ticket-content">{{ formattedTicket }}</pre>
          <div v-if="barcodeValue" class="ticket-barcode" aria-label="Codigo de barras">
            <img v-if="barcodeImage" :src="barcodeImage" :alt="barcodeValue" style="width: 100%; max-width: 100%; height: auto" />
            <span>{{ barcodeValue }}</span>
          </div>
        </div>
      </div>

      <!-- Botones de accion -->
      <div class="actions">
        <Button label="Cancelar" @click="$emit('close')" outlined />
        <Button
          label="Imprimir ticket"
          icon="pi pi-print"
          :disabled="printing" @click="doPrint"
          class="p-button-primary"
        />
      </div>
    </div>
  </div>
</Teleport>
