<Teleport to="body">
  <div class="thermal-overlay">
    <section class="thermal-modal" role="dialog" aria-modal="true" aria-labelledby="thermal-title">
      <header>
        <p>CAJA / IMPRESIÓN TÉRMICA</p>
        <h2 id="thermal-title">Ticket de corte</h2>
        <button type="button" aria-label="Cerrar" @click="emit('close')">×</button>
      </header>

      <div class="thermal-body">
        <AgnesConnectionNotice :refresh-key="agnesConnectionRevision" />
        <p>Se usará la impresora guardada en <strong>Configuración</strong>.</p>
        <ThermalTicketPreview :paper-width="paperWidth" :text="formattedTicket" :logo="logo" :barcode="barcodeValue" />
      </div>

      <footer>
        <AppButton label="Cancelar" outlined @click="emit('close')" />
        <AppButton
          label="Imprimir ticket"
          icon="pi pi-print"
          class="p-button-primary"
          :disabled="printing" @click="doPrint"
        />
      </footer>
    </section>
  </div>
</Teleport>
