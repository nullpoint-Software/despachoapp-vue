<Teleport to="body">
  <div class="ticket-printer-overlay">
    <div class="ticket-printer-modal">
      <!-- Seccion para seleccionar la impresora -->
      <AgnesConnectionNotice :refresh-key="agnesConnectionRevision" />
        <p>Se usará la impresora guardada en <strong>Configuración</strong>.</p>
        <!-- Vista previa del ticket -->
      <ThermalTicketPreview :paper-width="paperWidth" :text="formattedTicket" :logo="logo" :barcode="barcodeValue" />

      <!-- Botones de accion -->
      <div class="actions">
        <Button label="Imprimir" icon="pi pi-print" :disabled="printing" @click="doPrint" class="p-button-info" />
        <Button
          label="Cerrar"
          icon="pi pi-times"
          @click="$emit('close')"
          class="p-button-secondary"
        />
      </div>
    </div>
  </div>
</Teleport>
