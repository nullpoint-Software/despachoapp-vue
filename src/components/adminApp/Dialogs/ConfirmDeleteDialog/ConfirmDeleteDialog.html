<Teleport to="body">
  <transition name="fade">
    <div class="modal-overlay">
      <div class="modal-content relative bg-gray-50">
        <!-- Botón de cierre -->
        <!-- <button @click="cancel"
          class="absolute top-1 right-2 text-gray-600 hover:text-gray-800 text-3xl focus:outline-none">
          &times;
        </button> -->
        <!-- Encabezado -->
        <div
          class="standard-modal-header flex items-center space-x-4 mb-6 p-4 bg-white rounded-lg shadow"
        >
          <button type="button" class="standard-modal-close" aria-label="Cerrar" @click="cancel">
            ×
          </button>
          <i class="pi pi-exclamation-triangle text-3xl text-red-500"></i>
          <h3 class="text-2xl font-bold text-gray-800">Confirmar Eliminación</h3>
        </div>
        <!-- Mensaje y checkbox -->
        <div class="confirm-body mb-6 px-4">
          <p class="confirm-message text-center text-gray-700 mb-4">
            {{element ? element : "¿Estás seguro de eliminar este Elemento?" }}
            <br /><br />
            Marca la casilla para confirmar.
          </p>
          <div class="confirm-check flex items-center justify-center">
            <input type="checkbox" id="confirmDelete" v-model="agreed" class="mr-2" />
            <label for="confirmDelete" class="text-gray-700 font-medium"> Estoy de acuerdo </label>
          </div>
        </div>
        <!-- Footer: botones -->
        <div class="flex justify-end space-x-6 px-4">
          <Button label="Cancelar" icon="pi pi-times" class="p-button-text" @click="cancel" />
          <Button
            label="Confirmar"
            icon="pi pi-check"
            class="p-button-danger"
            :disabled="!agreed"
            @click="confirm"
          />
        </div>
      </div>
    </div>
  </transition>
</Teleport>
