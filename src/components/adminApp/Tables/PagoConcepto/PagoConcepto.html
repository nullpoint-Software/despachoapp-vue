<section class="record-table-shell" aria-label="Movimientos de pagos">
  <DataTable
    :value="payments"
    :loading="loadingPayments"
    :filters="filters"
    :globalFilterFields="[
        'id',
        'cliente',
        'asunto',
        'atendio',
        'cobramos',
        'pagamos',
        'fecha_legible',
      ]"
    :paginator="false"
    sortMode="multiple"
    removableSort
    :rows="10"
    :rowsPerPageOptions="[10, 20, 50]"
    class="records-table records-table--payments"
  >
    <template #header>
      <div class="records-table__toolbar">
        <div class="records-table__identity">
          <span>PAGOS / MOVIMIENTOS</span>
          <strong>Control de caja</strong>
        </div>
        <div class="records-table__controls">
          <label class="app-search-control records-table__search">
            <span class="sr-only">Buscar pagos</span>
            <i class="pi pi-search" aria-hidden="true"></i>
            <InputText
              v-model="filters.global.value"
              type="search"
              autocomplete="off"
              placeholder="Buscar cliente, concepto o responsable"
              aria-label="Buscar pagos"
            />
          </label>
          <div class="records-table__actions">
            <Button
              type="button"
              icon="pi pi-sliders-h"
              :label="isMobile ? activeFilterCount ? String(activeFilterCount) : '' : filterButtonLabel"
              aria-label="Abrir filtros de pagos"
              outlined
              title="Filtrar pagos"
              @click="openFilters"
            />
            <Button
              type="button"
              icon="pi pi-filter-slash"
              :label="isMobile ? '' : 'Limpiar filtros'"
              aria-label="Limpiar filtros de pagos"
              outlined
              title="Limpiar filtros"
              @click="clearFilter"
            />
            <ExportExcelButton />
            <Button
              type="button"
              icon="pi pi-plus"
              :label="isMobile ? '' : 'Nuevo pago'"
              :disabled="!canAddPagoConcepto"
              :title="canAddPagoConcepto ? 'Registrar un movimiento' : 'No tienes permiso para agregar pagos'"
              aria-label="Agregar pago"
              class="p-button-primary records-table__primary"
              @click="openCard(null)"
            />
          </div>
        </div>
      </div>
    </template>

    <!-- La columna de acciones es explícita y permanece fija al extremo derecho. -->
    <Column v-for="col in columns" :key="col.field" sortable :field="col.field">
      <template #header>
        <span class="records-table__column-label">{{ col.header }}</span>
      </template>
      <template #body="{ data }">
        <button
          v-if="col.field === 'fecha'"
          type="button"
          class="records-table__cell-button records-table__cell-content is-date"
          :title="formatFechaHoraFullPagoSQL(data[col.field])"
          :aria-label="'Copiar fecha ' + formatFechaHoraFullPagoSQL(data[col.field])"
          @click="copyToClipboard(formatFechaHoraFullPagoSQL(data[col.field]))"
        >
          {{ formatFechaHoraFullPagoSQL(data[col.field]) }}
        </button>
        <button
          v-else-if="col.field === 'cobramos' || col.field === 'pagamos'"
          type="button"
          class="records-table__cell-button records-table__cell-content is-money"
          :title="formatMoney(data[col.field])"
          :aria-label="'Copiar importe ' + formatMoney(data[col.field])"
          @click="copyToClipboard(formatMoney(data[col.field]))"
        >
          {{ formatMoney(data[col.field]) }}
        </button>
        <button
          v-else
          type="button"
          class="records-table__cell-button records-table__cell-content"
          :title="String(data[col.field] ?? '')"
          :aria-label="'Copiar ' + col.header + ': ' + String(data[col.field] ?? 'Sin dato')"
          @click="copyToClipboard(String(data[col.field] ?? ''))"
        >
          {{ data[col.field] }}
        </button>
      </template>
    </Column>
    <Column field="actions">
      <template #header>
        <span class="records-table__column-label">Acciones</span>
      </template>
      <template #body="{ data }">
        <div class="records-table__row-actions" role="group" aria-label="Acciones del pago">
          <Button
            v-if="canEditPagoConcepto"
            type="button"
            icon="pi pi-pencil"
            class="p-button-rounded p-button-warning"
            aria-label="Editar pago"
            title="Editar pago"
            @click="openCard(data)"
          />
          <Button
            type="button"
            icon="pi pi-print"
            class="p-button-rounded p-button-info"
            aria-label="Imprimir pago"
            title="Imprimir pago"
            @click="openPrint(data)"
          />
          <Button
            v-if="canDeletePagoConcepto"
            type="button"
            icon="pi pi-trash"
            class="p-button-rounded p-button-danger"
            aria-label="Eliminar pago"
            title="Eliminar pago"
            @click="openConfirmDialog(data)"
          />
        </div>
      </template>
    </Column>
  </DataTable>
  <footer class="app-pager">
    <span>{{ pagerLabel }}</span>
    <div class="app-pager__controls">
      <button
        type="button"
        class="app-pager__button"
        :disabled="currentPage === 0 || loadingPayments"
        aria-label="Página anterior"
        title="Página anterior"
        @click="previousPage"
      >
        <i class="pi pi-angle-left"></i>
      </button>
      <samp>{{ currentPage + 1 }} / {{ pageCount }}</samp>
      <button
        type="button"
        class="app-pager__button"
        :disabled="currentPage >= pageCount - 1 || loadingPayments"
        aria-label="Página siguiente"
        title="Página siguiente"
        @click="nextPage"
      >
        <i class="pi pi-angle-right"></i>
      </button>
      <select
        v-model.number="pageSize"
        aria-label="Registros por página"
        :disabled="loadingPayments"
      >
        <option v-for="option in pageSizeOptions" :key="option" :value="option">
          {{ option }} por página
        </option>
      </select>
    </div>
  </footer>
</section>
<AppFilterModal
  :visible="showFilters && !showDateRangeModal"
  title="Filtrar pagos"
  eyebrow="PAGOS / FILTROS"
  title-id="payments-filter-title"
  @close="closeFilters"
  @reset="resetDraftFilters"
  @apply="applyFilters"
>
  <AppFilterOptions
    v-model="draftMovementFilter"
    legend="Tipo de movimiento"
    name="payment-movement"
    :options="movementOptions"
  />
  <AppFilterOptions
    v-model="draftPeriodFilter"
    legend="Periodo"
    name="payment-period"
    :options="periodOptions"
  />
  <fieldset v-if="draftPeriodFilter === 'personalizado'" class="payment-period-fields">
    <legend>Rango personalizado</legend>
    <button type="button" class="payment-period-trigger" @click="openDateRangeModal">
      <span><small>Desde</small><strong>{{ formatFilterDate(draftDateFrom) }}</strong></span>
      <i class="pi pi-arrow-right" aria-hidden="true"></i>
      <span><small>Hasta</small><strong>{{ formatFilterDate(draftDateTo) }}</strong></span>
      <i class="pi pi-calendar" aria-hidden="true"></i>
    </button>
  </fieldset>
</AppFilterModal>
<DateRangeModal
  v-if="showDateRangeModal"
  :from="draftDateFrom"
  :to="draftDateTo"
  @close="closeDateRangeModal"
  @apply="applyDateRange"
/>
<!-- Toast y modales -->
<CardDetailPagoConcepto
  v-if="cardVisible"
  :pago="selectedPayment"
  :usuario="usuario"
  @close="cardVisible = false"
  @save="savePayment"
/>
<ConfirmDeleteDialog v-if="confirmDialogVisible" @confirm="confirmDelete" @cancel="cancelDelete" />
<!-- Modal de impresión -->
<PrintPagoConcepto v-if="printVisible" :payment="paymentToPrint" @close="printVisible = false" />
<PrintDialog
  v-if="printDialogVisible"
  @close="printDialogVisible = false"
  @ok="
      openPrint(payments[0]);
      printDialogVisible = false;
    "
/>
