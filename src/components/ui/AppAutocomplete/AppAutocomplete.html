<div class="app-autocomplete">
    <input
      v-bind="$attrs"
      :value="modelValue"
      :placeholder="placeholder"
      :disabled="disabled"
      :aria-invalid="invalid ? 'true' : 'false'"
      :aria-expanded="open ? 'true' : 'false'"
      :aria-controls="open ? listId : undefined"
      :aria-activedescendant="activeIndex >= 0 ? optionId(activeIndex) : undefined"
      role="combobox"
      aria-autocomplete="list"
      autocomplete="off"
      @input="onInput"
      @focus="openList"
      @blur="closeList"
      @keydown="onKeydown"
    />
    <div v-if="open" :id="listId" class="app-autocomplete__list" role="listbox">
      <div
        v-for="(option, index) in filteredOptions"
        :id="optionId(index)"
        :key="option"
        role="option"
        tabindex="-1"
        :aria-selected="index === activeIndex"
        :class="{ active: index === activeIndex }"
        @mousedown.prevent="selectOption(option)"
        @mouseenter="activeIndex = index"
      >
        {{ option }}
      </div>
      <span v-if="!filteredOptions.length" class="app-autocomplete__empty" role="status">Sin coincidencias. Puedes seguir escribiendo.</span>
    </div>
  </div>
