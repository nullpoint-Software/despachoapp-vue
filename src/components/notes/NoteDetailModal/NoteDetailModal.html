<Teleport to="body">
  <transition name="modal-fade">
    <div
      v-if="isVisible"
      class="fixed inset-0 z-[100] flex items-center justify-center p-4 modal-overlay"
    >
      <div
        v-if="note"
        class="note-detail-dialog" role="dialog" aria-modal="true" aria-labelledby="note-detail-title"
      >
        <header
          class="note-detail-header"
        >
          <div><p>NOTAS / DOCUMENTOS</p><h2 id="note-detail-title">{{ note.titulo }}</h2></div>
          <button type="button" aria-label="Cerrar nota" @click="$emit('close')" class="note-detail-close">
            <i class="pi pi-times text-xl"></i>
          </button>
        </header>

        <div class="p-5 overflow-y-auto note-content-display" v-html="renderedContent"></div>
      </div>
    </div>
  </transition>
</Teleport>
